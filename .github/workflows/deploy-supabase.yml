name: Deploy to Supabase

# Runs the rules tests, then applies new database migrations and deploys the
# send-otp function. Needs two repository secrets (Settings > Secrets and
# variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - the database password set when the project was created
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

concurrency: deploy-supabase

env:
  PROJECT_REF: dhynxoxhbgnwxfhjrraf

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Points rules tests
        env: { PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }
        run: supabase/tests/run_local.sh | tee out.txt && grep -q "ALL TESTS PASSED" out.txt

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings > Secrets and variables > Actions"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push --include-all
      - name: Deploy send-otp function
        run: supabase functions deploy send-otp --project-ref "$PROJECT_REF"
